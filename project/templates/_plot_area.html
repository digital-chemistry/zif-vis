<main class="plot-area merged-plot-card">
  <div class="plot-header-inline">
    <div class="plot-header-main">
      <div class="plot-header-title">ZIF Biocomposite Explorer</div>
      <div class="plot-header-subtitle">Parameters, phase maps, and stacked concentration layers</div>
    </div>

    <div class="plot-header-actions">
      <button
        type="button"
        class="header-icon-btn mobile-sidebar-toggle"
        id="openLeftSidebarBtn"
        aria-label="Open filters and controls panel"
        aria-controls="leftSidebar"
        aria-expanded="false"
      >
        <i data-lucide="panel-left-open"></i>
        <span class="sr-only">Open filters and controls panel</span>
      </button>

      <button type="button" class="plot-search-trigger" id="openCompositionPanel">
        <i data-lucide="search-code"></i>
        <span>Search / Predict</span>
      </button>

      <button
        type="button"
        class="header-icon-btn theme-toggle-btn"
        id="themeToggleBtn"
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        <i data-lucide="moon-star" class="theme-icon theme-icon-dark"></i>
        <i data-lucide="sun-medium" class="theme-icon theme-icon-light"></i>
        <span class="sr-only">Toggle color theme</span>
      </button>

      <button
        type="button"
        class="header-icon-btn mobile-sidebar-toggle"
        id="openRightSidebarBtn"
        aria-label="Open sample details panel"
        aria-controls="rightSidebar"
        aria-expanded="false"
      >
        <i data-lucide="panel-right-open"></i>
        <span class="sr-only">Open sample details panel</span>
      </button>

      <a
        class="plot-brand-link"
        href="https://www.tugraz.at/institute/ptc/research/the-falcaro-group"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit the Falcaro Group webpage"
      >
        <img
          id="plotBrandLogo"
          src="{{ url_for('static', filename='logo.png') }}"
          data-logo-light="{{ url_for('static', filename='logo.png') }}"
          data-logo-dark="{{ url_for('static', filename='logo_dark.png') }}"
          class="plot-brand-logo"
        >
      </a>
    </div>
  </div>

  <div class="plot-shell">
    <div id="plot" role="img" aria-label="Interactive plot loading" tabindex="0"></div>
    <div id="plotLoading" class="plot-loading is-hidden" aria-live="polite" aria-label="Loading data">
      <div class="spinner"></div>
      <div class="spinner-label">Loading dataset…</div>
    </div>
    <div id="plotEmptyState" class="plot-empty-state is-hidden" aria-live="polite"></div>
    <aside class="plot-overlay composition-panel is-hidden" id="compositionPanel">
      <div class="composition-panel-head">
        <div>
          <div class="composition-panel-eyebrow">Interactive query</div>
          <div class="composition-panel-title">Search and predict composition</div>
        </div>
        <button type="button" class="composition-panel-close" id="closeCompositionPanel" aria-label="Close search and prediction panel">×</button>
      </div>
