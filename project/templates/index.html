<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZIF Biocomposite Explorer</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/panels.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/forms.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/plot.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/inspector.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/responsive.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/docs.css') }}">

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="layout">
    {% include "_left_sidebar.html" %}
    {% include "_plot_area.html" %}
    {% include "_right_inspector.html" %}
  </div>

  {% include "_docs_modal.html" %}

  <script>
    window.ZIF_BASE_PATH = {{ request.script_root|tojson }};
  </script>
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    lucide.createIcons();
  </script>
  <script src="{{ url_for('static', filename='js/tour.js') }}"></script>
  <script>
    (function () {
      var modal = document.getElementById('docsModal');
      document.getElementById('openDocsBtn').addEventListener('click', function () { modal.showModal(); });
      document.getElementById('closeDocsModal').addEventListener('click', function () { modal.close(); });
      modal.addEventListener('click', function (e) { if (e.target === modal) modal.close(); });

      var replayBtn = document.getElementById('replayTourBtn');
      if (replayBtn) {
        replayBtn.addEventListener('click', function () {
          modal.close();
          if (window.__zifTour) { window.__zifTour.reset(); window.__zifTour.start(); }
        });
      }
    })();
  </script>
</body>
</html>
